<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <g>
    <!-- Fundo do ícone - círculo azul escuro -->
    <circle cx="32" cy="32" r="30" fill="#2C3E50"/>
    
    <!-- Formas de ondas -->
    <path d="M12,32 C16,22 20,42 24,32 C28,22 32,42 36,32 C40,22 44,42 48,32" 
          stroke="#1ABC9C" stroke-width="3" fill="none"/>
    
    <!-- Elipse representando o sinal de detecção -->
    <ellipse cx="32" cy="32" rx="15" ry="8" 
             stroke="#E74C3C" stroke-width="3" fill="none" transform="rotate(30, 32, 32)"/>
    
    <!-- Letras OAS -->
    <text x="32" y="48" font-family="Arial" font-size="12" font-weight="bold" 
          text-anchor="middle" fill="white">OAS</text>
  </g>
</svg> 